[package]
name = "htj2k"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "BSD-2-Clause"
repository = "https://github.com/jedypod/htj2k"
description = "High-Throughput JPEG 2000 (HTJ2K, ITU-T T.814) codestream codec in safe Rust, ported from OpenJPH"
keywords = ["jpeg2000", "htj2k", "codec", "image"]
categories = ["multimedia::images", "multimedia::encoding"]
# The tests, their vectors, the benchmark and the examples stay in the
# repository; the published crate is the library and its docs.
exclude = ["oracle/", "tests/", "bench/", "examples/"]

[dependencies]
# Only with the `simd` feature: run-time selection of the AVX2 kernels.
multiversion = { version = "0.9", optional = true }
# Only with the `simd` feature (multiversion depends on it already): a
# clear error on compilers older than the feature needs.
rustversion = { version = "1", optional = true }

[features]
default = ["simd"]
# On by default. AVX2 kernels on x86_64, chosen at run time; on aarch64
# the sample-level kernels compiled for NEON (the baseline); the scalar
# code elsewhere. Needs Rust 1.87 (safe intrinsics in
# `#[target_feature]` functions); on Rust 1.83 to 1.86 build with
# `default-features = false`.
simd = ["dep:multiversion", "dep:rustversion"]
